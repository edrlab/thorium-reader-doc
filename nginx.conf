server {
    listen 80;
    listen [::]:80;
    server_name thorium.edrlab.org *.thorium.edrlab.org;
    
    # Redirect all traffic to thotriumreader.com
    return 301 https://thotriumreader.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thorium.edrlab.org *.thorium.edrlab.org;
    
    # SSL certificates would go here
    # ssl_certificate /path/to/cert;
    # ssl_certificate_key /path/to/key;
    
    # Redirect all traffic to thotriumreader.com
    return 301 https://thotriumreader.com$request_uri;
}
